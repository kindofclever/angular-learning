<mat-toolbar color="primary">
  <app-logo></app-logo>

  <span class="spacer"></span>

  <!-- Desktop Navigation -->
  <nav class="desktop-nav">
    <app-nav-item [route]="['/', routes.HOME]" [label]="navLabels().home"></app-nav-item>
    <app-nav-item [route]="['/', routes.ABOUT]" [label]="navLabels().about"></app-nav-item>
    <app-nav-item [route]="['/', routes.SERVICES]" [label]="navLabels().services"></app-nav-item>
    <app-nav-item [route]="['/', routes.PRICING]" [label]="navLabels().pricing"></app-nav-item>
    <app-nav-item [route]="['/', routes.PROCEDURE]" [label]="navLabels().procedure"></app-nav-item>
    <app-nav-item [route]="['/', routes.IMPRESSIONS]" [label]="navLabels().impressions"></app-nav-item>
    <app-nav-item [route]="['/', routes.REVIEWS]" [label]="navLabels().reviews"></app-nav-item>
    <app-nav-item [route]="['/', routes.CONTACT]" [label]="navLabels().contact"></app-nav-item>

    <app-language-selector mode="desktop"></app-language-selector>
  </nav>

  <!-- Mobile Menu Button -->
  <app-mobile-menu-button [isOpen]="drawerOpen()" (toggle)="toggleDrawer()"></app-mobile-menu-button>
</mat-toolbar>

<!-- Mobile Drawer -->
<app-mobile-drawer [isOpen]="drawerOpen()" (close)="closeDrawer()"></app-mobile-drawer>

<a mat-fab extended [routerLink]="['/', routes.BOOKING]" class="booking-fab" color="primary">
  <mat-icon>event_available</mat-icon>
  {{ navLabels().booking }}
</a>
